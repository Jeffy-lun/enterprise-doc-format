name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-and-restyle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: python -m pip install --upgrade pip python-docx lxml

      - name: Build fixtures
        run: python evals/make_fixtures.py

      - name: Regression (audit + restyle)
        run: python evals/run_evals.py

      - name: Audit a compliant fixture (must exit 0)
        run: python scripts/audit_docx.py evals/fixtures/good.docx

      - name: Audit a broken fixture (must exit 1)
        run: |
          if python scripts/audit_docx.py evals/fixtures/bad.docx; then
            echo "expected non-zero exit for bad.docx"
            exit 1
          fi
